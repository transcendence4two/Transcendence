# Configurações do Banco de Dados
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:transcendence}
%prod.quarkus.datasource.username=${POSTGRES_USER:transcendence_user}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD:transcendence_password}

# Configurações do Hibernate
quarkus.hibernate-orm.database.generation=none

# Configurações do Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Servidor
quarkus.http.port=8003
quarkus.http.host=0.0.0.0

# REST Client para Usermanagement
quarkus.rest-client.usermanagement-client.url=${USERMANAGEMENT_SERVICE_URL:http://localhost:8000}

# OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/friends/openapi.json
quarkus.swagger-ui.path=/friends/docs
quarkus.swagger-ui.urls.primary=/api/friends/openapi.json
quarkus.smallrye-openapi.servers=/api

# JSON structured logging (quarkus-logging-json)
quarkus.log.console.json.pretty-print=false
quarkus.log.console.json.fields.timestamp.field-name=@timestamp
quarkus.log.console.json.fields.level.field-name=log.level
quarkus.log.console.json.fields.message.field-name=message
quarkus.log.console.json.fields.logger-name.field-name=logger.name
quarkus.log.console.json.additional-field."service.name".value=friends-service
quarkus.log.console.json.additional-field."service.name".type=string
quarkus.log.console.json.additional-field."service.environment".value=${ENV:development}
quarkus.log.console.json.additional-field."service.environment".type=string

# Logstash TCP handler (custom — via LogstashHandlerConfigurer)
logstash.host=${LOGSTASH_HOST:logstash}
logstash.port=5000
logstash.service-name=friends-service
logstash.service-environment=${ENV:development}
