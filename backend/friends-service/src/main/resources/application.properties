# Configurações do Banco de Dados
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:transcendence}
quarkus.datasource.username=${POSTGRES_USER:transcendence_user}
quarkus.datasource.password=${POSTGRES_PASSWORD:transcendence_password}

# Configurações do Hibernate
quarkus.hibernate-orm.database.generation=none

# Configurações do Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Servidor
quarkus.http.port=8003
quarkus.http.host=0.0.0.0

# REST Client para Usermanagement
quarkus.rest-client.usermanagement-client.url=${USERMANAGEMENT_SERVICE_URL:http://localhost:8000}
