quarkus.http.port=${QUARKUS_HTTP_PORT:8082}

quarkus.datasource.db-kind=${QUARKUS_DATASOURCE_DB_KIND:postgresql}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:transcendence}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:transcendence}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/usermanagement_db}

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# OpenAPI/Swagger Configuration
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.openapi.scan.disable=false

# Application Info for OpenAPI Documentation
quarkus.openapi.title=User Management Service API
quarkus.openapi.version=1.0.0
quarkus.openapi.description=API for user management - Registration, authentication and 2FA configuration
quarkus.openapi.contact.name=Transcendence Team
quarkus.openapi.contact.url=https://github.com/your-org/transcendence

# JWT config
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:usermanagement-service}
jwt.expiration.seconds=${JWT_EXPIRATION_SECONDS:2700}