services:
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-elasticsearch
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    restart: unless-stopped
    networks:
      - transcendence-network
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -u elastic:${ELASTIC_PASSWORD} http://localhost:9200 >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  logstash:
    container_name: logstash
    image: logstash
    ports:
      - "5000:5000"
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-logstash
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    restart: unless-stopped
    volumes:
      - ../logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - transcendence-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    container_name: kibana
    image: kibana
    ports:
      - "5601:5601"
    build:
      context: ../../
      dockerfile: infra/docker/dockerfile-kibana
    environment:
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=${XPACK_SECURITY_ENCRYPTIONKEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${XPACK_REPORTING_ENCRYPTIONKEY}
    restart: unless-stopped
    networks:
      - transcendence-network
    volumes:
      - kibana_data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    container_name: redis
    networks:
      - transcendence-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  tournament-postgres:
    image: postgres:16-bookworm
    container_name: tournament-postgres
    environment:
      - POSTGRES_DB=${TOURNAMENT_POSTGRES_DB:-tournament_service}
      - POSTGRES_USER=${TOURNAMENT_POSTGRES_USER:-tournament_user}
      - POSTGRES_PASSWORD=${TOURNAMENT_POSTGRES_PASSWORD:-tournament_password}
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - transcendence-network
    volumes:
      - tournament_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TOURNAMENT_POSTGRES_USER:-tournament_user} -d ${TOURNAMENT_POSTGRES_DB:-tournament_service}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-nginx
    ports:
      - "443:443"
    volumes:
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      - usermanagement-service
      - tournament-service
      - frontend
    restart: unless-stopped
    container_name: nginx
    networks:
      - transcendence-network

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-frontend
    expose:
      - "80"
    restart: unless-stopped
    container_name: frontend
    networks:
      - transcendence-network

  usermanagement-service:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-usermanagement
    env_file:
      - ../../.env
    expose:
      - "8000"
    restart: unless-stopped
    container_name: usermanagement-service
    networks:
      - transcendence-network
    depends_on:
      redis:
        condition: service_healthy

  tournament-service:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-tournament-service
    env_file:
      - ../../.env
    expose:
      - "8002"
    restart: unless-stopped
    container_name: tournament-service
    networks:
      - transcendence-network
    depends_on:
      tournament-postgres:
        condition: service_healthy

  emails-service:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-emails-service
    env_file:
      - ../../.env
    ports:
      - "4001:4001"
    restart: unless-stopped
    container_name: emails-service
    networks:
      - transcendence-network
    depends_on:
      redis:
        condition: service_healthy

volumes:
  esdata:
  kibana_data:
  tournament_postgres_data:

networks:
  transcendence-network:
    driver: bridge
