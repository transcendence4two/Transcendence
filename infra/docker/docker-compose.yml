services:
  elasticsearch-init:
      image: busybox
      command: sh -c "chown 1000:0 /snapshots && chmod 775 /snapshots"
      volumes:
        - essnapshots:/snapshots
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:9.2.6
    env_file:
      - ../../.env
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    restart: unless-stopped
    networks:
      - elk-ingest-network
      - elk-storage-network
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - essnapshots:/snapshots
      - ../elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -u elastic:${ELASTIC_PASSWORD} http://elasticsearch:9200 >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  elasticsearch-setup:
    container_name: elasticsearch-setup
    image: elasticsearch:9.2.6
    env_file:
      - ../../.env
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for i in {1..60}; do
          if curl -fsS -u "elastic:${ELASTIC_PASSWORD}" \
            -H "Content-Type: application/json" \
            -X POST "http://elasticsearch:9200/_security/user/kibana_system/_password" \
            -d "{\"password\":\"${ELASTICSEARCH_PASSWORD}\"}" >/dev/null; then
            echo "kibana_system password configured"
            exit 0
          fi
          sleep 2
        done
        echo "failed to configure kibana_system password" >&2
        exit 1
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    restart: "no"
    networks:
      - elk-storage-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch-bootstrap:
    container_name: elasticsearch-bootstrap
    image: elasticsearch:9.2.6
    env_file:
      - ../../.env
    entrypoint: ["/bin/bash", "/scripts/bootstrap-elasticsearch.sh"]
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_URL=http://elasticsearch:9200
      - ILM_DIR=/scripts/ilm
      - SLM_DIR=/scripts/slm
    restart: "no"
    networks:
      - elk-storage-network
    volumes:
      - ../scripts/bootstrap-elasticsearch.sh:/scripts/bootstrap-elasticsearch.sh:ro
      - ../elasticsearch/ilm:/scripts/ilm:ro
      - ../elasticsearch/slm:/scripts/slm:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-setup:
        condition: service_completed_successfully

  logstash:
    container_name: logstash
    image: logstash:9.2.6
    env_file:
      - ../../.env
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    restart: unless-stopped
    volumes:
      - ../logstash/pipeline/default.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ../logstash/pipeline/service_mapping.yml:/usr/share/logstash/config/service_mapping.yml:ro
    networks:
      - transcendence-network
      - elk-ingest-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  kibana:
    container_name: kibana
    image: kibana:9.2.6
    env_file:
      - ../../.env
    environment:
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=${XPACK_SECURITY_ENCRYPTIONKEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${XPACK_REPORTING_ENCRYPTIONKEY}
    restart: unless-stopped
    networks:
      - elk-storage-network
      - transcendence-network
    volumes:
      - kibana_data:/usr/share/kibana/data
      - ../kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-setup:
        condition: service_completed_successfully

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.52.0
    volumes:
      - prometheus_data:/prometheus
      - ../prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    restart: unless-stopped
    networks:
      - transcendence-network
      - grafana-monitoring-network

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.8.1
    pid: host #container sees host's process namespace
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - transcendence-network
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    restart: unless-stopped

  postgres-exporter:
    container_name: postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.15.0
    env_file:
      - ../../.env
    networks:
      - transcendence-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    restart: unless-stopped
    depends_on:
      - postgres

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - transcendence-network

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ../blackbox/config/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - transcendence-network

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    env_file:
      - ../../.env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_METRICS_ENABLED=true
    volumes:
      - ../grafana/config/provisioning/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    expose:
    - "3000"
    depends_on:
      - prometheus
    networks:
      - grafana-monitoring-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    container_name: redis
    networks:
      - transcendence-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-bookworm
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-transcendence}
      - POSTGRES_USER=${POSTGRES_USER:-transcendence_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-transcendence_password}
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - transcendence-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-transcendence_user} -d $${POSTGRES_DB:-transcendence}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-nginx
    ports:
      - "443:443"
    volumes:
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      - usermanagement-service
      - tournament-service
      - game-service
      - friends-service
      - frontend
      - kibana
    restart: unless-stopped
    container_name: nginx
    networks:
      - transcendence-network
      - grafana-monitoring-network

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-frontend
    expose:
      - "80"
    restart: unless-stopped
    container_name: frontend
    networks:
      - transcendence-network

  usermanagement-service:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-usermanagement
    env_file:
      - ../../.env
    expose:
      - "8000"
    restart: unless-stopped
    container_name: usermanagement-service
    networks:
      - transcendence-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  game-service:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-game-service
    env_file:
      - ../../.env
    expose:
      - "8001"
    restart: unless-stopped
    container_name: game-service
    networks:
      - transcendence-network
    depends_on:
      logstash:
        condition: service_healthy

  tournament-service:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-tournament-service
    env_file:
      - ../../.env
    expose:
      - "8002"
    restart: unless-stopped
    container_name: tournament-service
    networks:
      - transcendence-network
    depends_on:
      postgres:
        condition: service_healthy

  emails-service:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-emails-service
    env_file:
      - ../../.env
    ports:
      - "4001:4001"
    restart: unless-stopped
    container_name: emails-service
    networks:
      - transcendence-network
    depends_on:
      redis:
        condition: service_healthy
      logstash:
        condition: service_healthy

  minio:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecret123}
    volumes:
      - minio_data:/data
    networks:
      - transcendence-network

  minio-setup:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-minio-setup
    container_name: minio-setup
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecret123}
    networks:
      - transcendence-network

  friends-service:
    build:
      context: ../..
      dockerfile: infra/docker/dockerfile-friends-service
    env_file:
      - ../../.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-transcendence}
      - POSTGRES_USER=${POSTGRES_USER:-transcendence_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-transcendence_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - USERMANAGEMENT_SERVICE_URL=http://usermanagement-service:8000
    expose:
      - "8003"
    restart: unless-stopped
    container_name: friends-service
    networks:
      - transcendence-network
    depends_on:
      postgres:
        condition: service_healthy
      usermanagement-service:
        condition: service_started

volumes:
  esdata:
  essnapshots:
  kibana_data:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  transcendence-network:
    driver: bridge
  elk-ingest-network:
    driver: bridge
    internal: true
  elk-storage-network:
    driver: bridge
    internal: true
  grafana-monitoring-network:
    driver: bridge
    internal: true
