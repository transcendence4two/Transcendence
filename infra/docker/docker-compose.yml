version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: transcendence-postgres
    env_file:
      - ../../.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - transcendence-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcendence"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: transcendence-redis
    env_file:
      - ../../.env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - transcendence-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  game-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.game-service
    container_name: transcendence-game-service
    env_file:
      - ../../.env
    ports:
      - "${GAME_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transcendence-network
    restart: unless-stopped

  tournament-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.tournament-service
    container_name: transcendence-tournament-service
    env_file:
      - ../../.env
    ports:
      - "${TOURNAMENT_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transcendence-network
    restart: unless-stopped

  usermanagement-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.usermanagement-service
    container_name: transcendence-usermanagement-service
    env_file:
      - ../../.env
    ports:
      - "${USERMANAGEMENT_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transcendence-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  transcendence-network:
    driver: bridge
