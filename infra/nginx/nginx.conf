events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Timeouts de proxy
    proxy_connect_timeout 5s;   # tempo máximo para conectar ao serviço
    proxy_send_timeout    10s;  # tempo máximo para enviar a requisição
    proxy_read_timeout    30s;  # tempo máximo para receber a resposta

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=health_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=30r/s;
    
    limit_req_zone $binary_remote_addr zone=tournament_limit:10m rate=10r/s; # TODO: ajustar rate com o time
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream usermanagement {
        server usermanagement-service:8000;
    }

    upstream tournament {
        server tournament-service:8002;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Headers de segurança
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Validação interna de JWT
        location = /auth/validate {
            internal;
            proxy_pass http://usermanagement/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # Usermanagement reverse proxy
        location /api/users/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;
            proxy_pass http://usermanagement/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/health {
            limit_req zone=health_limit burst=50 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://usermanagement/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/users/docs {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://usermanagement/docs;
        }

        location /api/openapi.json {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://usermanagement/openapi.json;
        }

        location /api/redoc {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://usermanagement/redoc;
        }

        location /api/tournaments/health {
            limit_req zone=health_limit burst=50 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://tournament/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/tournaments/docs {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://tournament/tournaments/docs;
        }

        location /api/tournaments/openapi.json {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://tournament/tournaments/openapi.json;
        }

        location /api/tournaments/redoc {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://tournament/tournaments/redoc;
        }
        
        location /api/tournaments/ {
            auth_request /auth/validate;
            error_page 401 = @unauthorized;
            limit_req zone=tournament_limit burst=20 nodelay;
            limit_conn conn_limit 10;
            proxy_pass http://tournament/tournaments/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Resposta para requisições não autenticadas
        location @unauthorized {
            default_type application/json;
            return 401 '{"detail": "Authentication required"}';
        }

        # Frontend proxy
        location / {
            limit_req zone=frontend_limit burst=50 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}