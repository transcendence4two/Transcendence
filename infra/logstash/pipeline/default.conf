input {
  beats {
    port => 5044
  }

  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Usando translate para mapear serviço → índice/alias/policy
  translate {
    field => "[service.name]"
    destination => "[@metadata][service_config]"
    dictionary_path => "/usr/share/logstash/service_mapping.yml"
    fallback => {}
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"

    index => "%{[@metadata][service_config][index]}"
    ilm_enabled => true
    ilm_rollover_alias => "%{[@metadata][service_config][alias]}"
    ilm_policy => "%{[@metadata][service_config][policy]}"
  }

  stdout { codec => rubydebug }
}
